<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>찍꾸 · 성탄 네컷 프레임 12종</title>
<meta name="description" content="교회 성탄절에 함께 찍는 네컷 사진 프레임 12종. 말씀을 넣은 판과 넣지 않은 판.">
<meta property="og:title" content="찍꾸 · 성탄 네컷 프레임 12종"><meta property="og:description" content="말씀 넣은 판 / 안 넣은 판, 눌러서 크게 보고 저장하세요.">
<meta property="og:image" content="https://yoonho0809.github.io/jjikku-christmas/img/p-nativity-verse-s.jpg"><meta property="og:url" content="https://yoonho0809.github.io/jjikku-christmas/">
<style>
:root{--bg:#f6f1e7;--ink:#2b2418;--gold:#a8823c;--line:#e2d6bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;line-height:1.6}
header{text-align:center;padding:40px 20px 8px}h1{font-size:clamp(20px,6vw,28px);word-break:keep-all;margin:0;letter-spacing:.04em}h1 em{color:var(--gold);font-style:italic}
header p{margin:8px 0 0;color:#6d6252;font-size:15px}
.sw{display:flex;justify-content:center;gap:0;margin:22px auto 6px;border:1px solid var(--gold);border-radius:999px;width:max-content;overflow:hidden}
.sw button{font:inherit;font-size:16px;padding:10px 22px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.sw button[aria-pressed=true]{background:var(--gold);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px;max-width:1180px;margin:0 auto;padding:22px 20px 40px}
figure{margin:0}.pic{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.pic img{width:100%;aspect-ratio:3/4;display:block;background:#e9dfcc;box-shadow:0 6px 22px rgba(60,40,10,.18)}
figcaption{padding:12px 2px 0;font-size:15px}figcaption b{display:block;font-size:17px}
.v{color:#5d5242}.v small{color:var(--gold);white-space:nowrap}body.plain .v{display:none}
dialog{border:0;padding:0;background:transparent;max-width:96vw}dialog::backdrop{background:rgba(20,15,8,.82)}
dialog img{max-height:84vh;max-width:94vw;display:block;margin:auto}
.bar{display:flex;gap:10px;justify-content:center;margin-top:12px}.bar a,.bar button{font:inherit;font-size:16px;padding:10px 20px;border-radius:999px;border:1px solid #e9dcc0;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
footer{text-align:center;color:#8a7e6a;font-size:13px;padding:0 20px 40px}
.cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}.cta a{padding:10px 16px;border:1px solid var(--gold);border-radius:999px;color:var(--ink);text-decoration:none;font-size:15px}.cta a:first-child{background:var(--gold);color:#fff}.ios{font-size:12px;opacity:.7;margin:4px 0 0}
</style></head><body>
<header><h1>찍꾸 <em>Christmas</em><br>네컷 프레임</h1><p>성탄절, 성도님들과 함께 찍는 네컷 사진. 마음에 드는 프레임을 골라 보세요.</p>
<div class="sw" role="group" aria-label="말씀 넣기"><button id="bV" aria-pressed="true">말씀 넣은 판</button><button id="bP" aria-pressed="false">말씀 안 넣은 판</button></div><nav class="cta"><a href="https://github.com/yoonho0809/jjikku-christmas/releases/latest/download/jjikku.apk">안드로이드 앱 받기</a><a href="./app/">찍꾸 앱 열기 (아이폰·안드로이드)</a><a href="https://docs.google.com/forms/d/e/1FAIpQLSdB8cFw7buY3eC79G4ni35BEqgTWQSOEkEsdNZS4Bn3iVYLwg/viewform" target="_blank" rel="noopener">내가 만든 프레임 보내기</a></nav><p class="ios">「찍꾸 앱 열기」를 누르고 아래 안내대로 홈 화면에 추가하면 앱처럼 아이콘으로 열려요(아이폰은 Safari에서). 앱 안에는 일상·생일·여행 프레임도 있어요.</p></header>
<main><figure data-id="p-velvet"><button class="pic" aria-label="에메랄드 금박 크게 보기"><img loading="lazy" src="img/p-velvet-verse-s.jpg" alt="에메랄드 금박 프레임"></button>
<figcaption><b>에메랄드 금박</b><span class="v">“땅에서는 기뻐하심을 입은 사람들 중에 평화로다” <small>누가복음 2:14</small></span></figcaption></figure><figure data-id="p-ivory"><button class="pic" aria-label="아이보리 리스 크게 보기"><img loading="lazy" src="img/p-ivory-verse-s.jpg" alt="아이보리 리스 프레임"></button>
<figcaption><b>아이보리 리스</b><span class="v">“하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니” <small>요한복음 3:16</small></span></figcaption></figure><figure data-id="p-nativity"><button class="pic" aria-label="베들레헴의 밤 크게 보기"><img loading="lazy" src="img/p-nativity-verse-s.jpg" alt="베들레헴의 밤 프레임"></button>
<figcaption><b>베들레헴의 밤</b><span class="v">“오늘날 다윗의 동네에 너희를 위하여 구주가 나셨으니” <small>누가복음 2:11</small></span></figcaption></figure><figure data-id="p-jesus"><button class="pic" aria-label="세상의 빛 크게 보기"><img loading="lazy" src="img/p-jesus-verse-s.jpg" alt="세상의 빛 프레임"></button>
<figcaption><b>세상의 빛</b><span class="v">“나는 세상의 빛이니” <small>요한복음 8:12</small></span></figcaption></figure><figure data-id="q-burgundy"><button class="pic" aria-label="버건디 오너먼트 크게 보기"><img loading="lazy" src="img/q-burgundy-verse-s.jpg" alt="버건디 오너먼트 프레임"></button>
<figcaption><b>버건디 오너먼트</b><span class="v">“큰 기쁨의 좋은 소식을 너희에게 전하노라” <small>누가복음 2:10</small></span></figcaption></figure><figure data-id="q-angels"><button class="pic" aria-label="나팔 부는 천사 크게 보기"><img loading="lazy" src="img/q-angels-verse-s.jpg" alt="나팔 부는 천사 프레임"></button>
<figcaption><b>나팔 부는 천사</b><span class="v">“지극히 높은 곳에서는 하나님께 영광이요” <small>누가복음 2:14</small></span></figcaption></figure><figure data-id="q-madonna"><button class="pic" aria-label="마리아와 아기 예수 크게 보기"><img loading="lazy" src="img/q-madonna-verse-s.jpg" alt="마리아와 아기 예수 프레임"></button>
<figcaption><b>마리아와 아기 예수</b><span class="v">“그 이름은 임마누엘이라 하리라” <small>마태복음 1:23</small></span></figcaption></figure><figure data-id="q-shepherd"><button class="pic" aria-label="선한 목자 크게 보기"><img loading="lazy" src="img/q-shepherd-verse-s.jpg" alt="선한 목자 프레임"></button>
<figcaption><b>선한 목자</b><span class="v">“여호와는 나의 목자시니 내가 부족함이 없으리로다” <small>시편 23:1</small></span></figcaption></figure><figure data-id="q-wisemen"><button class="pic" aria-label="동방박사의 별 크게 보기"><img loading="lazy" src="img/q-wisemen-verse-s.jpg" alt="동방박사의 별 프레임"></button>
<figcaption><b>동방박사의 별</b><span class="v">“저희가 별을 보고 가장 크게 기뻐하고 기뻐하더라” <small>마태복음 2:10</small></span></figcaption></figure><figure data-id="q-silver"><button class="pic" aria-label="은빛 눈 예배당 크게 보기"><img loading="lazy" src="img/q-silver-verse-s.jpg" alt="은빛 눈 예배당 프레임"></button>
<figcaption><b>은빛 눈 예배당</b><span class="v">“여호와는 네게 복을 주시고 너를 지키시기를 원하며” <small>민수기 6:24</small></span></figcaption></figure><figure data-id="q-candle"><button class="pic" aria-label="대림절 촛불 크게 보기"><img loading="lazy" src="img/q-candle-verse-s.jpg" alt="대림절 촛불 프레임"></button>
<figcaption><b>대림절 촛불</b><span class="v">“평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라” <small>요한복음 14:27</small></span></figcaption></figure><figure data-id="q-stained"><button class="pic" aria-label="스테인드글라스 크게 보기"><img loading="lazy" src="img/q-stained-verse-s.jpg" alt="스테인드글라스 프레임"></button>
<figcaption><b>스테인드글라스</b><span class="v">“한 아기가 우리에게 났고 한 아들을 우리에게 주신바 되었는데” <small>이사야 9:6</small></span></figcaption></figure></main>
<dialog id="dl"><img id="big" alt=""><div class="bar"><a id="dn" download>이미지 저장</a><button id="cl">닫기</button></div></dialog>
<footer>사진 속 인물은 예시용 가상 인물입니다. 말씀: 개역한글.<br>「○○교회」·날짜는 찍을 때 앱에서 바꿀 수 있습니다.<br>찍꾸</footer>
<script>
let k='verse';const $=s=>document.querySelector(s);
function set(v){k=v;document.body.classList.toggle('plain',v==='plain');$('#bV').setAttribute('aria-pressed',v==='verse');$('#bP').setAttribute('aria-pressed',v==='plain');
document.querySelectorAll('figure').forEach(f=>f.querySelector('img').src='img/'+f.dataset.id+'-'+v+'-s.jpg')}
$('#bV').onclick=()=>set('verse');$('#bP').onclick=()=>set('plain');
document.querySelectorAll('.pic').forEach(b=>b.onclick=()=>{const id=b.parentElement.dataset.id,u='img/'+id+'-'+k+'.jpg';$('#big').src=u;$('#big').alt=b.querySelector('img').alt;$('#dn').href=u;$('#dn').download='jjikku-'+id+'-'+k+'.jpg';$('#dl').showModal()});
$('#cl').onclick=()=>$('#dl').close();$('#dl').onclick=e=>{if(e.target.id==='dl')$('#dl').close()};
</script></body></html>
